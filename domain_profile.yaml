# Domain profile — Thunderball (DISCO VOLANTE)
# Advisory agentic-research controls for this BOND film package.
# These are validation inputs only; they do not execute autonomous agents.

domain: special-agent mission software
film: thunderball
codename: DISCO VOLANTE

review_gates:
  - target: src/thunderball
    gate: "uv run pytest tests/ --cov=src --cov-fail-under=90"
    role: coverage and correctness
  - target: src/thunderball scripts
    gate: "uv run ruff check && uv run ruff format --check && uv run mypy src/ scripts/"
    role: lint and type cleanliness

source_policy:
  - pure domain core (dive_planner, convoy_integrity, submersible_logistics,
    sonar_detection, current_navigation, interdiction_analysis) uses stdlib
    only; no infrastructure, no bond_api imports.
  - only src/thunderball/mission.py adapts to the frozen bond_api protocol.
  - deterministic: fixed seed, no untracked RNG, no wall-clock in results.

artifact_expectations:
  - manuscript tokens computed in src/thunderball/manuscript_variables.py
  - figures generated by src/thunderball/figures.py into output/figures/

benchmark_rubric:
  default: bond-suite film guardrails (no mocks; >=90% coverage; deterministic)
