# Experiment plan — Thunderball (DISCO VOLANTE)
# Declares the flagship scenario, metrics, expected artifacts, and baseline.
# Validation input only; deterministic, no autonomous execution.

scenario:
  name: "DISCO VOLANTE underwater nuclear-recovery mission"
  film: thunderball
  codename: DISCO VOLANTE

conditions:
  dive:
    working_depth_m: 40
    cylinder_capacity_l: 12
    fill_pressure_bar: 207
    sac_rate_lmin: 20
  convoy_screen:
    escort_bearings_deg: [0, 45, 90, 135, 180, 225, 270, 315]
    detection_half_angle_deg: 30
    coverage_target: 0.9
  submersible:
    energy_kwh: 400
    drag_coeff: 0.035
    hotel_kw: 2.0
  sonar:
    f_khz: 10.0
    sl_db: 150.0
    nl_db: 75.0
    di_db: 15.0
  navigation:
    return_track_deg: 315.0
    own_speed_knots: 4.0
    current_set_deg: 90.0
    current_drift_knots: 0.8
    recovery_radius_nm: 1.0
  interdiction:
    threat_course_deg: 270.0
    threat_speed_knots: 20.0
    screen_radius_nm: 2.0
    min_separation_nm: 1.0
    escort_reaction_h: 0.05

primary_metric:
  - "mission success (bool): screen ok AND air duration > 0 AND best range > 0 AND sonar range > 0 AND drift within recovery AND interdiction held"
  - "convoy integrity score (0..1) and status"

expected_artifacts:
  - output/data/manuscript_variables.json (computed tokens)
  - output/figures/ndl_curve.png
  - output/figures/convoy_screen.png
  - output/figures/submersible_range.png
  - output/figures/transmission_loss.png
  - output/figures/drift_geometry.png

baseline: sable reference film (bond-api); this film adds six-concept domain computation
ablation: n/a — six independent domain modules invoked by one mission

determinism:
  seed: 7
  rule: results are pure functions of the config parameters; fixed seed, no RNG
