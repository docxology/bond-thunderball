# Claim ledger — Thunderball (DISCO VOLANTE)
# Registers sourced/derived numeric claims for evidence-registry validation.
# All values are derived deterministically by src/ domain math over the
# parameters in manuscript/config.yaml — none are hand-authored.

claims:
  - id: ndl_at_working_depth
    description: "No-decompression limit at the working depth (minutes)"
    derivation: "dive_planner.compute_ndl(depth_m, BuhlmannModel ZH-L16A)"
    token: RESULT_NDL_MINUTES
  - id: air_duration_at_working_depth
    description: "Bottom-time from air budget at the working depth (minutes)"
    derivation: "dive_planner air-budget: gas_volume / (SAC * P(depth))"
    token: RESULT_AIR_DURATION_MIN
  - id: convoy_largest_gap
    description: "Largest uncovered escort-sector angle (degrees)"
    derivation: "convoy_integrity.largest_gap(bearings)"
    token: RESULT_LARGEST_GAP_DEG
  - id: convoy_coverage
    description: "Escort-screen coverage fraction of the 360-degree perimeter"
    derivation: "convoy_integrity.coverage_fraction(bearings, half_angle)"
    token: RESULT_COVERAGE
  - id: convoy_score_status
    description: "Convoy integrity score and categorical status"
    derivation: "convoy_integrity.integrity_score / integrity_status"
    token: "RESULT_CONVOY_SCORE, RESULT_CONVOY_STATUS"
  - id: optimal_submersible_range
    description: "Best submersible range (nautical miles) and cruise speed"
    derivation: "submersible_logistics.optimal_range_speed / range_nm"
    token: "RESULT_OPTIMAL_RANGE_NM, RESULT_OPTIMAL_SPEED_KNOTS"
