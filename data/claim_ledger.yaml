# Claim ledger — Thunderball (DISCO VOLANTE)
# Registers sourced/derived numeric claims for evidence-registry validation.
# All values are derived deterministically by src/ domain math over the
# parameters in manuscript/config.yaml — none are hand-authored.

claims:
  - id: ndl_at_working_depth
    description: "No-decompression limit at the working depth (minutes)"
    derivation: "dive_planner.compute_ndl(depth_m, BuhlmannModel ZH-L16A)"
    token: RESULT_NDL_MINUTES
  - id: air_duration_at_working_depth
    description: "Bottom-time from air budget at the working depth (minutes)"
    derivation: "dive_planner air-budget: gas_volume / (SAC * P(depth))"
    token: RESULT_AIR_DURATION_MIN
  - id: convoy_largest_gap
    description: "Widest angular spacing between adjacent escorts (degrees).
      Bearing geometry only - it reads no detection half-angle and is NOT the
      unwatched arc."
    derivation: "convoy_integrity.largest_gap(bearings)"
    token: RESULT_LARGEST_GAP_DEG
  - id: convoy_uncovered_sector
    description: "Widest arc no escort watches (degrees); zero when the
      detection arcs overlap all the way round"
    derivation: "convoy_integrity.largest_uncovered_sector(bearings, half_angle)"
    token: RESULT_UNCOVERED_SECTOR_DEG
  - id: convoy_coverage
    description: "Escort-screen coverage fraction of the 360-degree perimeter"
    derivation: "convoy_integrity.coverage_fraction(bearings, half_angle)"
    token: RESULT_COVERAGE
  - id: convoy_score_status
    description: "Convoy integrity score and categorical status"
    derivation: "convoy_integrity.integrity_score / integrity_status"
    token: "RESULT_CONVOY_SCORE, RESULT_CONVOY_STATUS"
  - id: optimal_submersible_range
    description: "Best submersible range (nautical miles) and cruise speed"
    derivation: "submersible_logistics.optimal_range_speed / range_nm"
    token: "RESULT_OPTIMAL_RANGE_NM, RESULT_OPTIMAL_SPEED_KNOTS"
  - id: sonar_detection_range
    description: "Passive-sonar detection range (nautical miles)"
    derivation: "sonar_detection.detection_range_nm over Thorp TL"
    token: RESULT_SONAR_RANGE_NM
  - id: nav_drift_over_dive
    description: "Current drift over the dive's PLANNED bottom time -
      min(air limit, NDL) from plan_dive - in nautical miles"
    derivation: "current_navigation.drift_distance(drift, plan_dive bottom_minutes/60)"
    token: RESULT_NAV_DRIFT_NM
  - id: nav_heading_to_steer
    description: "Course-to-steer heading that makes good the return track"
    derivation: "current_navigation.course_to_steer vector triangle"
    token: RESULT_NAV_HEADING_DEG
  - id: interdiction_cpa
    description: "Threat closest-point-of-approach distance and time"
    derivation: "interdiction_analysis.closest_point_of_approach"
    token: "RESULT_CPA_DIST_NM, RESULT_CPA_TIME_H"
  - id: interdiction_status
    description: "Escort-screen interdiction verdict"
    derivation: "interdiction_analysis.interdiction_status"
    token: RESULT_INTERDICTION_STATUS
