# Thunderball — DISCO VOLANTE Mission Software
# BOND suite · film package · Thunderball (1965)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderball"
version = "0.1.0"
license = {text = "MIT"}
description = "DISCO VOLANTE — special-agent mission software: dive planning, NATO convoy integrity, submersible logistics."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[tool.uv.sources]
bond-api = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "bond_api.*"
ignore_missing_imports = true
